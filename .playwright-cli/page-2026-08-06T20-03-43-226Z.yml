akes an unbounded-body bug in any one // language extractor incapable of bloating global.db. An over-cap body is stored empty, // not truncated, so resolveBody still serves the complete symbol from source on read. insSym.run( s.filePath, s.name, s.kind, s.lineStart, s.lineEnd, boundSymbolBody(s.body), boundSymbolDocstring(s.docstring), s.parent, ) } const insRef = db.prepare( 'INSERT INTO refs (file_path, name, line, col, context) VALUES (?, ?, ?, ?, ?)', ) for (const r of result.refs) { if (r.name === '') continue insRef.run(r.filePath, r.name, r.line, r.col, r.context) } }) writeAll() }"
