name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    # A manual workflow_dispatch run must come off main -- otherwise anyone with write
    # access could publish an arbitrary feature-branch commit under the next npm version.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment:
      name: npm
      url: https://www.npmjs.com/package/token-goat
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Tarball smoke test
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/pack"
          INSTALL_DIR="$RUNNER_TEMP/smoke-install"
          DATA_DIR="$RUNNER_TEMP/smoke-data"
          mkdir -p "$PACK_DIR" "$INSTALL_DIR" "$DATA_DIR"
          TARBALL="$(npm pack --pack-destination "$PACK_DIR" | tail -1)"
          npm install -g "$PACK_DIR/$TARBALL" --prefix "$INSTALL_DIR"
          BIN="$INSTALL_DIR/bin/token-goat"
          "$BIN" --version
          # Index this checked-out repo through the installed tarball binary, then
          # look up a real symbol, so the smoke test exercises the shipped critical
          # path (parse -> index -> surgical read), not just the CLI entrypoint.
          export XDG_DATA_HOME="$DATA_DIR"
          "$BIN" index .
          "$BIN" symbol indexFileSync
        shell: bash
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
