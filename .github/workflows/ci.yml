name: CI
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix vscode-extension
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Type check (tests)
        run: npm run typecheck:tests
      - name: Type check (VS Code extension)
        run: npm run typecheck:vscode-extension
      - name: Type check (VS Code extension tests)
        run: npm run typecheck:vscode-extension:tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/@xenova/transformers/.cache
          key: xenova-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Retries absorb two known non-code causes of an otherwise-green run failing here: a
      # transient Hugging Face CDN block/rate-limit on the embedding model download (the app
      # itself now retries+backs off internally too, but a sustained outage outlasts that), and
      # a shared-runner "[vitest-worker]: Timeout calling 'onTaskUpdate'" RPC flake with zero
      # assertion failures anywhere in the run (vitest.config.ts's CI-only retry also covers
      # per-test instances of this). A real regression fails deterministically and still fails
      # after 3 attempts.
      - name: Test
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test
      # Explicit, so the extension's regression suite (vscode-extension/tests/security.test.ts)
      # stays wired to a gate even if the root vitest config's default file discovery ever
      # narrows its `include` -- `npm test` above already picks these tests up incidentally
      # today, but that was never intentional and is not something to depend on silently.
      - name: Test (VS Code extension)
        run: npm run test:vscode-extension

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/@xenova/transformers/.cache
          key: xenova-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Test
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test
      - name: Test (VS Code extension)
        run: npm run test:vscode-extension

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/@xenova/transformers/.cache
          key: xenova-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Test
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test
      - name: Test (VS Code extension)
        run: npm run test:vscode-extension
