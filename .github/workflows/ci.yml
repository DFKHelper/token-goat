      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: tg-model-${{ runner.os }}-${{ hashFiles('src/embed_model.ts') }}
      # The one place allowed to fetch the model. The suite itself never downloads it: the files that
      # exercise real embeddings gate on `modelFilesPresent()`, so `npm test` is offline by default.
      # That gate also means the test run can no longer populate this cache as a side effect, which is
      # why the download is a named step: on a restore miss it fetches once, the save step below then
      # keeps it, and on the next run the restore makes this step a no-op that prints so and exits.
      # Deliberately not conditioned on the restore missing: the script's own presence check is the
      # cheaper guard, and it also repairs a cache that restored as a hit while being incomplete,
