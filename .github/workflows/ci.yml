name: CI
# `push` is scoped to main on purpose. With a bare `on: [push, pull_request]` a commit on a branch
# with an open PR fires both events, so the entire suite ran twice for one commit.
on:
  push:
    branches: [main]
  pull_request:

# A superseded run is wasted work that also delays the run you are waiting for: four pushes in an
# hour meant four full suites queued against the same runner pool, and the newest one waited behind
# three that no longer described any commit anyone cared about. Newest run per ref wins.
# The cost is real and worth stating: an intermediate commit on main can now end without a green
# run of its own. That is acceptable here because a release is cut from a tip that gets its own
# full run, and it is the tip's result that gates publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. CI only ever reads the repository; a job that needs more has to
# ask for it explicitly, so a future step cannot quietly inherit a writable token.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix vscode-extension
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Type check (tests)
        run: npm run typecheck:tests
      - name: Type check (VS Code extension)
        run: npm run typecheck:vscode-extension
      - name: Type check (VS Code extension tests)
        run: npm run typecheck:vscode-extension:tests

  # A secrets scan the repository configures but never runs is a document, not a control.
  # `.gitleaks.toml` allowlists this suite's redaction fixtures; `tests/guards/gitleaks_allowlist_scope.test.ts`
  # holds that allowlist away from `src/`, and this job is the thing that makes either matter.
  #
  # The binary is fetched from a pinned release and checksum-verified rather than run through a
  # marketplace action, so hardening the secrets scan does not add a third-party action to the
  # supply chain of every CI run.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan for committed secrets
        run: ./gitleaks dir . --config=.gitleaks.toml --redact --exit-code 1 --no-banner

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Exported here rather than in a job-level `env:` block, because the `runner` context does not exist at job level and naming it there makes GitHub reject the whole workflow file. Without this each worker resolves the model under its own temp data root and refetches the 32 MB weights: one run did it 57 times.
      - name: Point the embedding model cache at a path that outlives the data root
        shell: bash
        run: |
          echo "TOKEN_GOAT_MODEL_CACHE_DIR=${RUNNER_TEMP}/tg-model-cache" >> "$GITHUB_ENV"
          # Read by tests/guards/embed_model_available_where_required.test.ts: here the weights are warmed deliberately, so the seven files that gate real embeddings on them must run rather than skip, and a suite that skips them reports success while covering nothing.
          echo "TOKEN_GOAT_REQUIRE_EMBED_MODEL=1" >> "$GITHUB_ENV"
      # Restored, not `actions/cache`, so the save can be held back until the cache is worth keeping (see the save step at the end of this job).
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: tg-model-${{ runner.os }}-${{ hashFiles('src/embed_model.ts') }}
      # The one place allowed to fetch the model. The suite itself never downloads it: the files that
      # exercise real embeddings gate on `modelFilesPresent()`, so `npm test` is offline by default.
      # That gate also means the test run can no longer populate this cache as a side effect, which is
      # why the download is a named step: on a restore miss it fetches once, the save step below then
      # keeps it, and on the next run the restore makes this step a no-op that prints so and exits.
      # Deliberately not conditioned on the restore missing: the script's own presence check is the
      # cheaper guard, and it also repairs a cache that restored as a hit while being incomplete,
      # which an `if` on cache-hit would leave broken for as long as the key survives. A failure here
      # is reported as a failure, instead of silently degrading the whole population to skips.
      - name: Warm the embedding model cache
        shell: bash
        run: npm run model:warm
      # Retries absorb a shared-runner "[vitest-worker]: Timeout calling 'onTaskUpdate'" RPC flake
      # with zero assertion failures anywhere in the run (vitest.config.ts's CI-only retry also
      # covers per-test instances of this). A real regression fails deterministically and still
      # fails after 3 attempts. The embedding model download used to be retried here too; it now
      # has its own retries in the warm step above, which is the only step that fetches it.
      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test -- --shard=${{ matrix.shard }}/3
      # Explicit, so the extension's regression suite (vscode-extension/tests/security.test.ts)
      # stays wired to a gate even if the root vitest config's default file discovery ever
      # narrows its `include` -- `npm test` above already picks these tests up incidentally
      # today, but that was never intentional and is not something to depend on silently.
      - name: Test (VS Code extension)
        if: matrix.shard == 1
        run: npm run test:vscode-extension
      # A cache saved half-populated would be restored forever and never rewritten, because the key would already exist: every run would then pay the download again in
      # the warm step above while the cache reported a hit. So the save waits until the weights are actually present, and is skipped entirely on a restore hit.
      - name: Check the embedding model cache is worth saving
        id: model-cache-complete
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          root="${RUNNER_TEMP}/tg-model-cache"
          if [ -d "$root" ] && [ "$(find "$root" -name '*.onnx' -size +30M | wc -l)" -gt 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save the embedding model cache
        if: always() && steps.model-cache-complete.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
