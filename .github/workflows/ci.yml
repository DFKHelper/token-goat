name: CI
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy src

  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - name: Test
        # ``-rfE`` prints short tracebacks for failures and errors at the
        # end of the run so a CI failure surfaces the actual assertion or
        # exception in the log without needing to download artefacts.
        # ``--tb=short`` keeps each entry compact (one line per frame) so
        # the summary stays readable even when several tests fail at once.
        # No output redirection or pipe — earlier attempts to capture
        # stdout via ``tee`` (git-bash) and ``Tee-Object`` (PowerShell)
        # both deadlocked on the Windows runner.  pytest's own output
        # lands directly in the action log; failure tracebacks are
        # surfaced via ``-rfE`` so the in-line log already contains the
        # actionable detail without needing artefact downloads.
        run: uv run pytest -rfE --tb=short
