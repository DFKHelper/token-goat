name: CI
# `push` is scoped to main on purpose. With a bare `on: [push, pull_request]` a commit on a branch
# with an open PR fires both events, so the entire suite ran twice for one commit.
on:
  push:
    branches: [main]
  pull_request:

# A superseded run is wasted work that also delays the run you are waiting for: four pushes in an
# hour meant four full suites queued against the same runner pool, and the newest one waited behind
# three that no longer described any commit anyone cared about. Newest run per ref wins.
# The cost is real and worth stating: an intermediate commit on main can now end without a green
# run of its own. That is acceptable here because a release is cut from a tip that gets its own
# full run, and it is the tip's result that gates publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. CI only ever reads the repository; a job that needs more has to
# ask for it explicitly, so a future step cannot quietly inherit a writable token.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix vscode-extension
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Type check (tests)
        run: npm run typecheck:tests
      - name: Type check (VS Code extension)
        run: npm run typecheck:vscode-extension
      - name: Type check (VS Code extension tests)
        run: npm run typecheck:vscode-extension:tests

  # A secrets scan the repository configures but never runs is a document, not a control.
  # `.gitleaks.toml` allowlists this suite's redaction fixtures; `tests/guards/gitleaks_allowlist_scope.test.ts`
  # holds that allowlist away from `src/`, and this job is the thing that makes either matter.
  #
  # The binary is fetched from a pinned release and checksum-verified rather than run through a
  # marketplace action, so hardening the secrets scan does not add a third-party action to the
  # supply chain of every CI run.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan for committed secrets
        run: ./gitleaks dir . --config=.gitleaks.toml --redact --exit-code 1 --no-banner

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Without this each worker resolves the model under its own temp data root and refetches the 32 MB weights: one run did it 57 times.
      TOKEN_GOAT_MODEL_CACHE_DIR: ${{ runner.temp }}/tg-model-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Restored, not `actions/cache`, so the save can be held back until the cache is worth keeping (see the save step at the end of this job).
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: tg-model-${{ runner.os }}-${{ hashFiles('src/embed_model.ts') }}
      # Retries absorb two known non-code causes of an otherwise-green run failing here: a
      # transient Hugging Face CDN block/rate-limit on the embedding model download (the app
      # itself now retries+backs off internally too, but a sustained outage outlasts that), and
      # a shared-runner "[vitest-worker]: Timeout calling 'onTaskUpdate'" RPC flake with zero
      # assertion failures anywhere in the run (vitest.config.ts's CI-only retry also covers
      # per-test instances of this). A real regression fails deterministically and still fails
      # after 3 attempts.
      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test -- --shard=${{ matrix.shard }}/3
      # Explicit, so the extension's regression suite (vscode-extension/tests/security.test.ts)
      # stays wired to a gate even if the root vitest config's default file discovery ever
      # narrows its `include` -- `npm test` above already picks these tests up incidentally
      # today, but that was never intentional and is not something to depend on silently.
      - name: Test (VS Code extension)
        if: matrix.shard == 1
        run: npm run test:vscode-extension
      # A cache saved half-populated would be restored forever and never rewritten, because the key would already exist: the expensive file would go on being
      # downloaded while the cache reported a hit. So the save waits until the weights are actually present, and is skipped entirely on a restore hit.
      - name: Check the embedding model cache is worth saving
        id: model-cache-complete
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          root="${RUNNER_TEMP}/tg-model-cache"
          if [ -d "$root" ] && [ "$(find "$root" -name '*.onnx' -size +30M | wc -l)" -gt 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save the embedding model cache
        if: always() && steps.model-cache-complete.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Without this each worker resolves the model under its own temp data root and refetches the 32 MB weights: one run did it 57 times.
      TOKEN_GOAT_MODEL_CACHE_DIR: ${{ runner.temp }}/tg-model-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Restored, not `actions/cache`, so the save can be held back until the cache is worth keeping (see the save step at the end of this job).
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: tg-model-${{ runner.os }}-${{ hashFiles('src/embed_model.ts') }}
      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test -- --shard=${{ matrix.shard }}/4
      - name: Test (VS Code extension)
        if: matrix.shard == 1
        run: npm run test:vscode-extension
      # A cache saved half-populated would be restored forever and never rewritten, because the key would already exist: the expensive file would go on being
      # downloaded while the cache reported a hit. So the save waits until the weights are actually present, and is skipped entirely on a restore hit.
      - name: Check the embedding model cache is worth saving
        id: model-cache-complete
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          root="${RUNNER_TEMP}/tg-model-cache"
          if [ -d "$root" ] && [ "$(find "$root" -name '*.onnx' -size +30M | wc -l)" -gt 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save the embedding model cache
        if: always() && steps.model-cache-complete.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Without this each worker resolves the model under its own temp data root and refetches the 32 MB weights: one run did it 57 times.
      TOKEN_GOAT_MODEL_CACHE_DIR: ${{ runner.temp }}/tg-model-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Restored, not `actions/cache`, so the save can be held back until the cache is worth keeping (see the save step at the end of this job).
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: tg-model-${{ runner.os }}-${{ hashFiles('src/embed_model.ts') }}
      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test -- --shard=${{ matrix.shard }}/3
      - name: Test (VS Code extension)
        if: matrix.shard == 1
        run: npm run test:vscode-extension

  # The stable check name the branch ruleset points at. The sharded jobs report as `test-linux (1)`, `test-windows (2)` and so on, so a required context naming a shard would stop gating the moment the shard count changed; this job keeps one name the ruleset can pin, and pulls Windows and macOS under the same gate while it is there.
      # A cache saved half-populated would be restored forever and never rewritten, because the key would already exist: the expensive file would go on being
      # downloaded while the cache reported a hit. So the save waits until the weights are actually present, and is skipped entirely on a restore hit.
      - name: Check the embedding model cache is worth saving
        id: model-cache-complete
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          root="${RUNNER_TEMP}/tg-model-cache"
          if [ -d "$root" ] && [ "$(find "$root" -name '*.onnx' -size +30M | wc -l)" -gt 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save the embedding model cache
        if: always() && steps.model-cache-complete.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  test:
    if: always()
    needs: [test-linux, test-windows, test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every sharded test job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "test job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required test job did not succeed (results: $results)."
              exit 1
            fi
          done
