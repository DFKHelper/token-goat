name: CI
on: [push, pull_request]

# Least privilege by default. CI only ever reads the repository; a job that needs more has to
# ask for it explicitly, so a future step cannot quietly inherit a writable token.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix vscode-extension
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Type check (tests)
        run: npm run typecheck:tests
      - name: Type check (VS Code extension)
        run: npm run typecheck:vscode-extension
      - name: Type check (VS Code extension tests)
        run: npm run typecheck:vscode-extension:tests

  # A secrets scan the repository configures but never runs is a document, not a control.
  # `.gitleaks.toml` allowlists this suite's redaction fixtures; `tests/guards/gitleaks_allowlist_scope.test.ts`
  # holds that allowlist away from `src/`, and this job is the thing that makes either matter.
  #
  # The binary is fetched from a pinned release and checksum-verified rather than run through a
  # marketplace action, so hardening the secrets scan does not add a third-party action to the
  # supply chain of every CI run.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan for committed secrets
        run: ./gitleaks dir . --config=.gitleaks.toml --redact --exit-code 1 --no-banner

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@xenova/transformers/.cache
          key: xenova-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Retries absorb two known non-code causes of an otherwise-green run failing here: a
      # transient Hugging Face CDN block/rate-limit on the embedding model download (the app
      # itself now retries+backs off internally too, but a sustained outage outlasts that), and
      # a shared-runner "[vitest-worker]: Timeout calling 'onTaskUpdate'" RPC flake with zero
      # assertion failures anywhere in the run (vitest.config.ts's CI-only retry also covers
      # per-test instances of this). A real regression fails deterministically and still fails
      # after 3 attempts.
      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test
      # Explicit, so the extension's regression suite (vscode-extension/tests/security.test.ts)
      # stays wired to a gate even if the root vitest config's default file discovery ever
      # narrows its `include` -- `npm test` above already picks these tests up incidentally
      # today, but that was never intentional and is not something to depend on silently.
      - name: Test (VS Code extension)
        run: npm run test:vscode-extension

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@xenova/transformers/.cache
          key: xenova-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test
      - name: Test (VS Code extension)
        run: npm run test:vscode-extension

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@xenova/transformers/.cache
          key: xenova-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Test
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm test
      - name: Test (VS Code extension)
        run: npm run test:vscode-extension
