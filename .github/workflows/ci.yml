      - run: npm ci
      # Exported here rather than in a job-level `env:` block, because the `runner` context does not exist at job level and naming it there makes GitHub reject the whole workflow file. Without this each worker resolves the model under its own temp data root and refetches the 32 MB weights: one run did it 57 times.
