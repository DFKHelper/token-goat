        if: matrix.shard == 1
        run: npm run test:vscode-extension

  # The stable check name the branch ruleset points at. The sharded jobs report as `test-linux (1)`, `test-windows (2)` and so on, so a required context naming a shard would stop gating the moment the shard count changed; this job keeps one name the ruleset can pin, and pulls Windows and macOS under the same gate while it is there.
      # A cache saved half-populated would be restored forever and never rewritten, because the key would already exist: every run would then pay the download again in
      # the warm step above while the cache reported a hit. So the save waits until the weights are actually present, and is skipped entirely on a restore hit.
      - name: Check the embedding model cache is worth saving
        id: model-cache-complete
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          root="${RUNNER_TEMP}/tg-model-cache"
          if [ -d "$root" ] && [ "$(find "$root" -name '*.onnx' -size +30M | wc -l)" -gt 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save the embedding model cache
        if: always() && steps.model-cache-complete.outputs.ok == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tg-model-cache
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  test:
    if: always()
    needs: [test-linux, test-windows, test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every sharded test job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "test job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required test job did not succeed (results: $results)."
              exit 1
            fi
          done
