[package]
name = "tg-hook"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Native hook client for token-goat: relays a hook call to the resident hook server, or runs the Node command it wraps."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[[bin]]
name = "tg-hook"
path = "src/main.rs"

[dependencies]
# The endpoint id is a SHA-256 of the data and bundle directories, as in src/hook_ipc.ts endpointId.
sha2 = "0.11"
# Every handshake frame carries an HMAC-SHA256 (src/hook_ipc.ts mac); a vetted implementation rather than a hand-rolled one.
hmac = "0.13"
# Frames are JSON; also parses the --selftest-vectors input.
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# getuid/geteuid/getgid/getegid for the key-ownership check and the token-goat-<uid> socket directory, getrandom for the handshake nonce, prctl so a fallback child dies with this process; std exposes none of them.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# std has no named-pipe client with a timeout: the pipe is opened overlapped so every read and write can be abandoned at its deadline (CreateFileW, WaitNamedPipeW, ReadFile/WriteFile, CancelIoEx). Also the process creation time (GetProcessTimes) for elapsedMs, the OS random source for the nonce (ProcessPrng, which std itself uses), and a job object so a fallback child dies with this process. Declarations only: windows-link binds each function to its system DLL, with no import library crate.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
