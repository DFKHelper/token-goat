pre-commit:
  commands:
    lint:
      run: uv run ruff check {staged_files}
      glob: "*.py"
    wal-guard:
      run: uv run pytest tests/test_wal_growth_guard.py -q --tb=short
      glob: "*.py"

pre-push:
  commands:
    typecheck:
      run: uv run mypy src
    test:
      run: uv run pytest -q --tb=short
