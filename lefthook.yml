pre-commit:
  commands:
    lint:
      run: uv run ruff check {staged_files}
      glob: "*.py"
    wal-guard:
      run: uv run pytest tests/test_wal_growth_guard.py -q --tb=short
      glob: "*.py"

pre-push:
  commands:
    typecheck:
      run: uv run mypy src
    test:
      env:
        PYTHONIOENCODING: "utf-8:replace"
        TOKEN_GOAT_NO_WORKER_SPAWN: "1"
      # Mirror CI: -n 0 (serial) avoids xdist INTERNALERROR worker crashes.
      # shell: bash ensures "not slow" quotes are handled correctly on Windows
      # (lefthook.exe uses cmd.exe by default, mangling quoted arguments).
      run: uv run pytest -n 0 -m "not slow" -q --tb=short
      shell: bash
