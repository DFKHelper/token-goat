pre-commit:
  commands:
    lint:
      run: uv run ruff check {staged_files}
      glob: "*.py"
    wal-guard:
      run: uv run pytest tests/test_wal_growth_guard.py -q --tb=short
      glob: "*.py"

pre-push:
  commands:
    typecheck:
      run: uv run mypy src
    test:
      env:
        PYTHONIOENCODING: "utf-8:replace"
      # Match CI's fast-tier filter and Windows worker cap. CI pins to -n 2
      # on Windows runners to avoid xdist INTERNALERROR worker crashes under
      # heavy parallelism. The same pin applies locally.
      run: uv run pytest -m "not slow" -n 2 -q --tb=short
