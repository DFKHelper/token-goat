pre-commit:
  commands:
    ts-typecheck:
      run: npm run typecheck
      glob: "**/*.ts"
    ts-lint:
      run: npm run lint
      glob: "**/*.ts"

pre-push:
  commands:
    all-checks:
      # Single bash wrapper runs typecheck + tests in parallel internally.
      # Avoids lefthook's parallel-mode EvalSymlinks canonicalize failure on
      # Windows (affects commands with glob: on parallel runners when stdin
      # is read concurrently).
      run: bash .lefthook-scripts/run-all-checks.sh
