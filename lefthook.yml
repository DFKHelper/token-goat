pre-commit:
  commands:
    lint:
      run: uv run ruff check {staged_files}
      glob: "*.py"
    wal-guard:
      run: uv run pytest tests/test_wal_growth_guard.py -q --tb=short
      glob: "*.py"

pre-push:
  commands:
    typecheck:
      run: uv run mypy src
    test:
      env:
        PYTHONIOENCODING: "utf-8:replace"
      # Match CI's fast-tier filter — slow concurrency tests run in CI's
      # opt-in slow tier where they get a clean runner. Locally under
      # heavy disk pressure they go flaky and produce false alarms.
      run: uv run pytest -m "not slow" -q --tb=short
